version: 2

project_name: gcli

builds:
  - id: gcli
    main: ./cmd/gcli
    binary: gcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/daflecardoso/gcli/internal/version.Version={{ .Version }}
      - -X github.com/daflecardoso/gcli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/daflecardoso/gcli/internal/version.Date={{ .Date }}

archives:
  - id: gcli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: daflecardoso
    name: gcli
